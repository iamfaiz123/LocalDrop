[package]
name = "localdrop_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "LocalDrop local-network media sharing engine (HTTP + WebSocket server, sessions, uploads, downloads)"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "localdrop-server"
path = "src/bin/localdrop-server.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
crc32fast = "1"
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
libc = "0.2"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio-tungstenite = "0.26"
tempfile = "3"
zip = { version = "2", default-features = false }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
